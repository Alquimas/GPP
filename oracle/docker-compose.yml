services:
  test:
    build: .
    command: ["vitest", "run"]
    volumes:
      - .:/app
      - ../gsfen:/gsfen:ro
      - /app/node_modules

  check:
    build: .
    command: ["tsc", "--noEmit"]
    volumes:
      - .:/app
      - ../gsfen:/gsfen:ro
      - /app/node_modules

  lint:
    build: .
    command: ["eslint", "src", "tests"]
    volumes:
      - .:/app
      - ../gsfen:/gsfen:ro
      - /app/node_modules

  format:
    build: .
    command: ["prettier", "--write", "src/**/*.ts", "tests/**/*.ts", "*.{js,json,ts}"]
    volumes:
      - .:/app
      - ../gsfen:/gsfen:ro
      - /app/node_modules

  format-check:
    build: .
    command: ["prettier", "--check", "src/**/*.ts", "tests/**/*.ts", "*.{js,json,ts}"]
    volumes:
      - .:/app
      - ../gsfen:/gsfen:ro
      - /app/node_modules
