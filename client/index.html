<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gungi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Info bar -->
  <div id="info-bar">
    <span class="ib-phase">---</span>
    <span class="ib-turn">---</span>
    <span class="ib-counter"></span>
    <span class="ib-done" style="display:none"></span>
    <span class="ib-result" style="display:none"></span>
  </div>

  <!-- Main game area -->
  <div id="game-area">
    <!-- Left: Black hand -->
    <div id="hand-black" class="hand-zone"></div>

    <!-- Center: Board -->
    <div id="board-area">
      <div id="board-frame">
        <div id="board"></div>
      </div>
      <div id="controls"></div>
      <div id="status-msg"></div>
    </div>

    <!-- Right column: White hand + move list -->
    <div id="right-column">
      <div id="hand-white" class="hand-zone"></div>
      <div id="move-list"></div>
    </div>
  </div>

  <!-- Track B: AI decision panel -->
  <div id="decision-panel" class="hidden">
    <div class="dp-head">
      <span class="dp-title">AI Decision</span>
      <span id="dp-head-summary" class="dp-summary"></span>
      <button class="ctrl-btn" id="dp-attacked" style="display:none">Attacked</button>
      <button class="ctrl-btn" id="dp-toggle">▸ Details</button>
      <button class="ctrl-btn" id="dp-export">Export (JSONL)</button>
    </div>
    <div id="dp-legend" class="dp-legend"></div>
    <div id="dp-body" class="hidden"></div>
  </div>
</div>

<!-- Stack popup -->
<div id="stack-popup"></div>

<!-- Outcome chooser (Capture vs Stack) -->
<div id="outcome-chooser"></div>

<!-- Game over overlay -->
<div id="game-over-overlay">
  <div class="go-box"></div>
</div>

<!-- New Game dialog -->
<div id="newgame-dialog">
  <div class="ng-box">
    <h2>New Game</h2>
    <p>Start a new game from the standard position, or enter a GSFEN string for a custom starting position.</p>
    <input type="text" placeholder="Leave empty for standard start, or paste a GSFEN string">
    <div class="ng-actions">
      <select id="ng-ai" title="AI opponent (Track B observability)">
        <option value="none">AI: none</option>
        <option value="black">AI: black</option>
        <option value="white">AI: white</option>
        <option value="both">AI: both (watch)</option>
      </select>
      <button class="btn-cancel" id="ng-cancel">Cancel</button>
      <button class="btn-primary" id="ng-confirm">Start Game</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
